# Publishes to PyPI via a Trusted Publisher (OIDC). No API token is stored
# anywhere: PyPI is configured to trust this repository, this workflow file by
# name, and the `pypi` environment below. Changing any of those three breaks
# publication rather than silently publishing from somewhere unexpected.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The gate runs FIRST and publication depends on it. A release that skips the
  # suite would ship an artifact nothing had checked -- and this project's
  # recurring defect is a check that quietly stops running, so the one place it
  # must be impossible to skip is the one that reaches strangers.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just check
      - name: conformance suite (stock git)
        run: just conform
      - name: the suite must be able to fail
        run: just mutants
      - name: a second implementation, from the spec alone
        run: just conform-alt

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build

      # The tag is the version. A mismatch means the artifact on PyPI would not
      # be the commit the tag names, and PyPI publication is irreversible.
      - name: the tag must match the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*rowspec-(.*)\.tar\.gz/\1/')
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match built version $built"
            exit 1
          fi
          echo "tag v$tag matches built version $built"

      # The action at the repository root installs a pinned rowspec. If that
      # pin drifts from the version being released, `uses: kindspec/rowspec@vX`
      # runs something other than X and nothing says so.
      - name: action.yml must pin the version being released
        run: |
          pinned=$(grep -oE 'rowspec==[0-9]+\.[0-9]+\.[0-9]+' action.yml | head -1 | cut -d= -f3)
          built=$(ls dist/*.tar.gz | sed -E 's/.*rowspec-(.*)\.tar\.gz/\1/')
          if [ "$pinned" != "$built" ]; then
            echo "::error::action.yml pins rowspec==$pinned but this release is $built"
            exit 1
          fi
          echo "action.yml pins rowspec==$pinned, matching the release"

      # An artifact whose own CLI does not run is not publishable.
      - name: the built wheel actually works
        run: |
          uv run --with dist/*.whl --no-project python - <<'PY'
          import subprocess, sys, tempfile, os
          d = tempfile.mkdtemp()
          bad = os.path.join(d, "bad.mdtbl")
          open(bad, "w").write(
              "| id | a | z | t = a / z |\n| -- | -: | -: | -: |\n| r_1 | 5 | 0 |  |\n")
          r = subprocess.run([sys.executable, "-m", "rowspec", "eval",
                              "--format", "github", d], capture_output=True, text=True)
          assert r.returncode != 0, "eval passed a table whose total is #REF!"
          assert "::error" in r.stdout, "eval --format github emitted no annotation"
          print("wheel CLI: eval refuses a broken total and annotates it")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the OIDC token the Trusted Publisher exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
