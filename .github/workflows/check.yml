name: check
# Pushes to main only. A PR branch then produces each required check once,
# from the pull_request run; with a bare `push` every push to a PR branch ran
# the same jobs twice, and the merge gate resolved each required name to
# whichever of two runs it found (#43).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, not tags. `astral-sh/setup-uv@v10` was a real
      # RELEASE (v10.0.1) with no moving `v10` tag behind it, and the job
      # died at `Unable to resolve action` before running anything -- the
      # same failure mode this commit exists to fix, one layer up. A SHA
      # cannot drift and cannot be re-pointed under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # `just` is not on the runner image. Without this the job died at its
      # first command with exit code 127, and the red masked the fact that the
      # conformance suite and the mutation gate had never run at all -- a job
      # that fails before its checks is indistinguishable, from the outside,
      # from one whose checks fail. Installed through uv rather than a third
      # party action: uv is already a dependency here and nothing else is.
      - name: install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: just is actually on PATH
        run: just --version

      # Each step reports independently. A failing `check` must not hide
      # whether the tests ran, which is the whole complaint above -- and
      # this project's own thesis applied to its own CI. The suite, the
      # second implementation and the mutation gate are not here: they are
      # kindkit's gates, run by the `kind` job below.
      - name: lint and format
        if: always()
        run: just check

      # `just test` had never run in CI. The suite ran here through `just
      # conform` and `just mutants`, so the gap was invisible -- but tests/
      # also holds the CSV refusals and the packaging boundary, and nothing on
      # a forge executed either. It runs WITHOUT the xlsx extra, deliberately:
      # that is what `pip install rowspec` produces, and the boundary is only
      # worth anything if the configuration a stranger gets is the one that is
      # checked. The assertion in front of it is the point -- `uv run` syncing
      # an extra by default would make the whole job measure the wrong thing,
      # silently, and it would still be green. `--exact`, like `just test`:
      # plain `uv run` removes nothing, so it can see an environment the
      # step it guards will never run in (#40).
      - name: the extra must be ABSENT in this job
        if: always()
        run: |
          uv run --exact python -c "import importlib.util, sys; \
            sys.exit('openpyxl is installed; this job must run without the extra') \
            if importlib.util.find_spec('openpyxl') else None"
      - name: the full test suite, with the extra absent
        if: always()
        run: just test

      # NOTE: deliberately NOT run over conformance/cases -- those fixtures are
      # meant to be malformed. This is the recipe a USER should copy: `check`
      # answers "will this survive being edited", `eval` answers "does it
      # currently say anything false", and a pipeline with only the first is
      # green on a broken total.
      - name: example -- the recipe a user should copy
        if: always()
        run: |
          uv run python -m rowspec check docs/example || true
          uv run python -m rowspec eval  docs/example || true

  # The other half of the same boundary. The exporter's tests SKIP when the
  # extra is absent, so without this job they would never run anywhere and the
  # suite would report a pass over an exporter nothing had executed --- the
  # exact failure this project keeps finding in itself. `just test-xlsx` sets
  # ROWSPEC_REQUIRE_XLSX=1, which turns that skip into a hard failure, so this
  # job cannot go green by measuring nothing.
  xlsx-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: install just
        run: |
          uv tool install rust-just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the exporter, with its optional extra installed
        run: just test-xlsx

  # kindkit's reusable workflow: the case tree against the convention, the
  # suite on the reference implementation, the same tree on the second
  # implementation, and the mutation gate. It reports as `kind /
  # conformance`, and that name is the interface a ruleset matches on --
  # renaming this job id renames the check (kindspec/.github AGENTS.md §3.2).
  #
  # The commit in `uses:` must be the commit the `dev` group pins kindkit to
  # in pyproject.toml: the workflow fetches kindkit's tools at this commit,
  # and the runner and gate it drives are the pinned package. Two kits would
  # mean the gates check a contract the code under them does not keep.
  # tests/test_pins.py fails when the two differ, so move them together.
  kind:
    # The workflow reads its own run to find the commit it was called at, and
    # a called workflow can hold no more than its caller grants.
    permissions:
      contents: read
      actions: read
    uses: kindspec/kindkit/.github/workflows/kind.yml@8e21b558c85d5612009f3a1d69a3a68bc0191637
    with:
      fixture-root: conformance/cases
      suite: cd conformance && uv run python run_cases.py
      second-implementation: cd conformance && uv run python run_cases.py rowspec_alt.table
      mutants: cd conformance && uv run python mutants.py
