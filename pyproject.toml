[project]
name = "rowspec"
version = "0.1.0"
description = "A specification and conformance suite for tabular data that must survive version control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Cameron Brooks", email = "cambrooks3393@gmail.com" }]
keywords = ["csv", "markdown", "git", "merge", "conformance", "specification"]
# The WHEEL contains only `reference/rowspec`, which is Apache-2.0 OR MIT. The
# repository as a whole is licensed per directory -- SPEC.md and docs/ are
# CC-BY-4.0, conformance/cases/ is CC0-1.0 -- and that split is deliberate:
# the fixtures must be vendorable into an implementation in any language under
# any licence. See LICENSE and LICENSES/.
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "reference/LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kindspec/rowspec"
Source = "https://github.com/kindspec/rowspec"
Issues = "https://github.com/kindspec/rowspec/issues"
Specification = "https://github.com/kindspec/rowspec/blob/main/SPEC.md"

[project.scripts]
rowspec = "rowspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference/rowspec"]

# The sdist carries the SPEC and the fixture tree deliberately. The suite is
# the deliverable; shipping the implementation without the thing that checks it
# would distribute the least valuable half.
[tool.hatch.build.targets.sdist]
include = [
  "/reference",
  "/conformance",
  "/tests",
  "/docs",
  "/SPEC.md",
  "/README.md",
  "/CONTRIBUTING.md",
  "/NOTICE",
  "/LICENSE",
  "/LICENSES",
  "/justfile",
  "/pyproject.toml",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reference", "conformance"]
