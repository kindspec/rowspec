[project]
name = "rowspec"
version = "0.1.0"
description = "A specification and conformance suite for tabular data that must survive version control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Cameron Brooks", email = "cambrooks3393@gmail.com" }]
keywords = ["csv", "markdown", "git", "merge", "conformance", "specification"]
# The WHEEL contains `reference/rowspec` and `export/rowspec_xlsx`, both of
# which are Apache-2.0 OR MIT. The repository as a whole is licensed per
# directory -- SPEC.md and docs/ are CC-BY-4.0, conformance/cases/ is CC0-1.0
# -- and that split is deliberate: the fixtures must be vendorable into an
# implementation in any language under any licence. See LICENSE and LICENSES/.
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "reference/LICENSE", "export/LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]

# xlsx export is an EXTRA, and `dependencies` above stays empty, because
# `reference/` is standard-library-only: a dependency there is a dependency
# every independent implementation of the format inherits, and an independent
# implementation of a table format must not be required to read xlsx. The
# exporter therefore lives in `export/`, outside `reference/`, and
# `tests/test_boundary.py` fails if anything under `reference/` ever imports it.
[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/kindspec/rowspec"
Source = "https://github.com/kindspec/rowspec"
Issues = "https://github.com/kindspec/rowspec/issues"
Specification = "https://github.com/kindspec/rowspec/blob/main/SPEC.md"

[project.scripts]
rowspec = "rowspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `export/rowspec_xlsx` ships in the wheel unconditionally; only its
# dependency is optional. An extra that installs openpyxl and no exporter would
# install nothing that does anything.
packages = ["reference/rowspec", "export/rowspec_xlsx"]

# The sdist carries the SPEC and the fixture tree deliberately. The suite is
# the deliverable; shipping the implementation without the thing that checks it
# would distribute the least valuable half.
[tool.hatch.build.targets.sdist]
include = [
  "/reference",
  "/export",
  "/conformance",
  "/tests",
  "/docs",
  "/SPEC.md",
  "/README.md",
  "/CONTRIBUTING.md",
  "/NOTICE",
  "/LICENSE",
  "/LICENSES",
  "/justfile",
  "/pyproject.toml",
]

# kindkit is the shared conformance machinery -- the tree-driven runner and the
# mutation gate -- extracted from this repository and now depended on rather
# than duplicated. It is a DEV dependency, deliberately: `dependencies` above
# stays empty, so `pip install rowspec` still pulls nothing and `reference/`
# still imports the standard library and nothing else. Only `conformance/`
# reaches for it, and `tests/test_boundary.py` is what holds that line.
#
# Pinned to a COMMIT, not a branch: kindkit is pre-release, has no tag and is
# not on PyPI, and a gate that moves under the suite it gates is the failure
# this project keeps finding in itself. Move the pin deliberately, and
# re-measure the suite and the gate when you do.
[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "kindkit @ git+https://github.com/kindspec/kindkit@d5cb2169dc265576f9c21cdf6306cf07b27ff426",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reference", "conformance", "export"]
