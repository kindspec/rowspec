[project]
name = "rowspec"
version = "0.0.0"
description = "A specification and conformance suite for tabular data that must survive version control"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rowspec = "rowspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reference/rowspec"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["reference", "conformance"]
